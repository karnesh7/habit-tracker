version: '3.8'

services:
  # Backend Express REST API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: habit_tracker_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super-secret-habit-tracker-key-2026
      - NODE_ENV=development
    volumes:
      - ./server/prisma:/app/prisma

  # Frontend Vite React SPA Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: habit_tracker_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
